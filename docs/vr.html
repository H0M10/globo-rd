<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070D1A">
<title>Globo RDS · AR y VR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/vr.css">
<link rel="modulepreload" href="js/vendor/xr.js">
</head>
<body class="pagina-xr">

<div id="escena" class="escena" aria-label="Globo en 3D para realidad aumentada y virtual"></div>

<!-- Esta capa también se ve DENTRO de la realidad aumentada (WebXR DOM Overlay) -->
<div id="ui" class="ui-xr">
  <div id="ar-gestos" class="ar-gestos" hidden></div>

  <header class="barra">
    <a class="marca" href="./" id="xr-volver" aria-label="Volver al globo">GLOBO<span>/</span>RDS</a>
    <div class="barra-der">
      <span id="xr-crono" class="xr-crono" data-fase="libre"><span id="xr-crono-etiqueta">Libre</span> <b id="xr-crono-tiempo"></b></span>
      <span id="conexion" class="vivo" data-estado="conectando" role="status"><i></i><span id="conexion-texto">Conectando</span></span>
    </div>
  </header>

  <section id="xr-inicio" class="xr-inicio">
    <h1>Pon el mundo<br>sobre la mesa</h1>
    <p id="xr-yo" class="xr-yo"></p>
    <div class="xr-botones">
      <button type="button" id="btn-ar" class="boton" hidden>Ver en mi cuarto (AR)</button>
      <button type="button" id="btn-vr" class="boton secundario" hidden>Entrar a realidad virtual</button>
    </div>
    <ul class="xr-ayuda">
      <li><b>Toca</b> un país libre para conquistarlo</li>
      <li><b>Toca</b> uno ajeno y pulsa <b>Liberar</b> para poder tomarlo</li>
      <li><b>Arrastra</b> para girar · <b>pellizca</b> para agrandar</li>
    </ul>
    <p id="xr-soporte" class="xr-soporte"></p>
  </section>

  <p id="ar-indicacion" class="ar-indicacion" hidden></p>

  <section id="ficha" class="ficha" hidden aria-live="polite">
    <div class="ficha-cabeza">
      <div>
        <p class="ficha-continente" id="ficha-continente"></p>
        <h2 id="ficha-nombre"></h2>
      </div>
      <button type="button" class="cerrar" id="ficha-cerrar" aria-label="Cerrar">×</button>
    </div>
    <p id="ficha-dueno" class="ficha-dueno"></p>
    <button type="button" id="ficha-accion" class="boton" hidden></button>
  </section>

  <div id="ar-controles" class="ar-controles" hidden>
    <button type="button" class="boton secundario" id="ar-colocar">Poner en la mesa</button>
    <button type="button" class="boton" id="ar-salir">Salir</button>
  </div>

  <div id="cintillo" class="cintillo" aria-live="polite" hidden></div>
</div>

<div id="cargando" class="cargando"><p>Cargando el mapa…</p></div>

<script src="js/config.js"></script>
<script type="module" src="js/vr.js"></script>
</body>
</html>
